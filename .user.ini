; The server turns display_errors and short_open_tag on globally; PHP-FPM
; (prod's and the local stack's) applies this file to every script in the
; site's root directory.
; Hide PHP errors from visitors (they still go to the error log).
display_errors = Off
; Only "<?php" opens PHP code: code after a bare "<?" is served as text.
short_open_tag = Off
